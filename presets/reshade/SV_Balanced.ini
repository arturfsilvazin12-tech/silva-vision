; 🇧🇷 SILVA VISION — SV BALANCED V0.1
; 🧪 EXPERIMENTAL
; Base deliberadamente conservadora: correção mínima + nitidez controlada.
; A cadeia será ampliada apenas após testes de custo/benefício.

PreprocessorDefinitions=RESHADE_DEPTH_INPUT_IS_UPSIDE_DOWN=0,RESHADE_DEPTH_INPUT_IS_REVERSED=0,RESHADE_DEPTH_LINEARIZATION_FAR_PLANE=1000.0
Techniques=CAS@CAS.fx
TechniqueSorting=CAS@CAS.fx

[CAS.fx]
Contrast=0.010000
Sharpening=0.220000

; 🎯 Filosofia Balanced:
; - não usar bloom pesado por padrão
; - não usar DOF
; - não usar chromatic aberration
; - não usar efeitos depth sem validação
; - manter custo previsível
